# =============================================================================
# 冠水回避ルート検索アプリ 全国版 ── 前処理の設定
#
# ★絶対ルール4: 重み・閾値・パラメータは全てここに外出しする。コードに直書きしない。
# ★絶対ルール10: 未確定値を推測で埋めない。`null` ＋ TODO コメントで置く。
#   `null` のまま `Config.require()` で読むと**落ちる**。それが仕組みとして正しい。
#
# ★藤沢版（../../Kansui/preprocess/config.yaml）との関係:
#   決定済みの値は根拠ごと引き継ぐ。**他地域での妥当性は未検証**のものが多いので、
#   引き継いだ値には「藤沢の実測で決めた」と明記してある。
# =============================================================================

# -----------------------------------------------------------------------------
# regions ── ★ここが「引数」。地域を足せば別の地域を流せる
#
# 藤沢版は団体コード `14205` と `EPSG:6677` をコードに直書きしていた
# （実測: 6677 が 19ファイル・66行／14205 が 1ファイル・5行）。
# 全国版はここから引き当てる（src/kansui/region.py, src/kansui/crs.py）。
# -----------------------------------------------------------------------------
regions:
  # ★★地域ごとに作り、**書き出しで全国を1つにまとめる**（2026-09-23 に作りを変えた）。
  #   各地域の作成（build_region.py）は「エッジごとの最終表」を
  #   `data/raw/final/{地域}.parquet` に書くところまで。
  #   巨大強連結成分・最高速度・道路名の表は**全体で1つに決まる値**なので、
  #   ★地域ごとには決めない。`tools/export_national.py` が全地域を合わせてから決める。
  #   （以前の注記「別々に作って後で合わせる形にしない」の懸念は、これで解消した）
  #
  # ★地域の選び方: 環境変数 `KANSUI_REGION=<名前>`。**既定の地域は持たない**。
  # ★1地域の大きさは**メモリで決まる**（16GB）。東京都＋神奈川県（208万エッジ）が実績の上限。
  #   県単位を基本にする。
  #
  # ★都道府県コード（JIS X 0401）は**必ず引用符付きの2桁文字列**にする。
  #   引用符が無いと YAML が数値として読み、"01"（北海道）が 1 になって
  #   先頭の 0 が落ちる。T-16（`0466251111` が8進数で 81351241 になった）と同じ筋。
  #   → `region.Region` は型が str であることを必須にしている。**緩めないこと。**
  tokyo_kanagawa:
    # ★2026-09-23、神奈川県 → **東京都＋神奈川県**に広げた（利用者の依頼:
    #   「神奈川圏外のルート検索ができない」）。
    # ★画面に出す対象範囲の名前。範囲の外をタップしたときの説明に使う
    label: "東京都（島しょ部を除く）・神奈川県"

    pref_codes: ["13", "14"]  # 東京都・神奈川県

    # 更に市町村で絞る場合（5桁の団体コード・文字列）。県全域なら null
    municipality_codes: null

    # ★外す市町村（5桁の団体コード・文字列）。東京都の**島しょ部**を外す。
    #   本土と道路でつながらず、含めると区画・DEM・幅員タイルが数百km先まで飛び地で広がる。
    #   ★コードは N03（2026年版）から**緯度で**確かめた（2026-09-23）。
    #     9団体とも代表点が北緯 34.80度以下、本土の最南（町田市）は 35.56度で、はっきり離れている。
    #     ★N03_002（支庁）はこの版では空で、それでは判別できなかった。
    exclude_municipality_codes:
      # ★★「所属未定地」（都道府県コード＋000）。これを外し忘れると、
      #   **鳥島・孀婦岩（北緯 29.79度）まで範囲が伸びた**（2026-09-23 に実測）。
      #   123件のうち本土側（東京湾の埋立地）は 3件で、**3件とも +3km バッファの内側**に
      #   入ることを確かめた ＝ 外しても湾内の道路は落ちない。
      - "13000"   # 所属未定地 29.79〜35.65
      - "13361"   # 大島町     34.80
      - "13362"   # 利島村     34.53
      - "13363"   # 新島村     34.48
      - "13364"   # 神津島村   34.25
      - "13381"   # 三宅村     34.12
      - "13382"   # 御蔵島村   33.90
      - "13401"   # 八丈町     33.16
      - "13402"   # 青ヶ島村   32.47
      - "13421"   # 小笠原村   27.74

    # メッシュを直接指定する場合（北海道の「系の境界の帯」など）。文字列の配列
    mesh_codes: null

    # 経路確保のための外側バッファ［km］。★藤沢版は 3.0 だった。
    #   県単位ではこの意味が変わる（隣県へはみ出す）ので Phase 1 で見直す
    buffer_km: 3.0

  saitama:
    label: "埼玉県"
    pref_codes: ["11"]   # 埼玉県
    municipality_codes: null
    exclude_municipality_codes: null
    mesh_codes: null
    buffer_km: 3.0

